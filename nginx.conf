server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite /terminos y /privacidad sin extensión .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache razonable para estáticos, sin cachear el HTML
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
