server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enlaces de reseña de V Reviews: verificame.co/r/<código> se reenvía a la
    # función `r` de Supabase (proyecto verificame-core), que registra el clic y
    # redirige a Google. Es solo un reenvío: este sitio sigue sin backend propio.
    #
    # El destino va en una variable y con `resolver` a propósito: así nginx resuelve
    # el nombre en cada petición en vez de fijar una IP al arrancar, que quedaría
    # vieja si Supabase cambia de dirección. El User-Agent del cliente se conserva
    # (nginx lo reenvía por defecto) porque la función lo usa para separar los
    # clics de personas de las visitas de WhatsApp que arman la vista previa.
    location ^~ /r/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $destino_resenas "https://tjyqfrtkjnwqxzmrcvmx.supabase.co";
        rewrite ^/r/(.*)$ /functions/v1/r/$1 break;
        proxy_pass $destino_resenas;
        proxy_ssl_server_name on;
        proxy_set_header Host tjyqfrtkjnwqxzmrcvmx.supabase.co;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Permite /terminos y /privacidad sin extensión .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache razonable para estáticos, sin cachear el HTML
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
